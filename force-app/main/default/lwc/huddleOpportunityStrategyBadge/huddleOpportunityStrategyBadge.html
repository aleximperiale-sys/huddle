<template>
  <template if:true={hasActivity}>
    <div class="badge">
      <div class="badge__head">
        <div>
          <div class="badge__title">
            <lightning-icon
              icon-name="custom:custom18"
              size="x-small"
            ></lightning-icon>
            <span>Huddle strategy history</span>
          </div>
          <div class="badge__internal">
            Internal deal strategy — never surfaced to the customer.
          </div>
        </div>
        <lightning-button
          variant="base"
          label={toggleLabel}
          onclick={toggle}
        ></lightning-button>
      </div>

      <div class="stats">
        <div class="stat">
          <lightning-icon
            icon-name="utility:groups"
            size="x-small"
            alternative-text="Strategy sessions"
          ></lightning-icon>
          <div>
            <div class="stat__figure">{sessions}</div>
            <div class="stat__label">strategy sessions</div>
          </div>
        </div>

        <div class="stat">
          <lightning-icon
            icon-name="utility:task"
            size="x-small"
            alternative-text="Action items"
          ></lightning-icon>
          <div>
            <div class="stat__figure">{actionItems}</div>
            <div class="stat__label">action items</div>
          </div>
        </div>

        <div class="stat">
          <svg
            width="44"
            height="44"
            viewBox="0 0 44 44"
            role="img"
            aria-label={decisionRing.alt}
          >
            <circle
              class="ring__track"
              cx="22"
              cy="22"
              r={decisionRing.r}
              fill="none"
              stroke-width="5"
            ></circle>
            <circle
              class="ring__fill"
              cx="22"
              cy="22"
              r={decisionRing.r}
              fill="none"
              stroke-width="5"
              stroke-linecap="round"
              stroke-dasharray={decisionRing.dash}
              transform="rotate(-90 22 22)"
            ></circle>
            <text
              class="ring__value"
              x="22"
              y="22"
              text-anchor="middle"
              dominant-baseline="central"
            >
              {decisionRing.label}
            </text>
          </svg>
          <div>
            <div class="stat__label">decisions still unresolved</div>
          </div>
        </div>
      </div>

      <template if:true={hasOpenDecisions}>
        <div class="alert">
          <lightning-icon
            icon-name="utility:warning"
            variant="warning"
            size="xx-small"
            alternative-text="Unresolved"
          ></lightning-icon>
          <span>{openDecisionLabel}</span>
        </div>
      </template>

      <template if:true={expanded}>
        <div class="history">
          <template for:each={rows} for:item="row">
            <div key={row.id} class="history__item">
              <div class="history__title">{row.title}</div>
              <div class="history__meta">
                <span>{row.meta}</span>
                <template if:true={row.hasStrategyLog}>
                  <a
                    class="history__link"
                    data-id={row.strategyLogId}
                    onclick={openRecord}
                    >View meeting recap</a
                  >
                </template>
              </div>
            </div>
          </template>
          <template if:true={hasMore}>
            <div class="empty slds-p-top_x-small">{moreLabel}</div>
          </template>
        </div>
      </template>
    </div>
  </template>

  <template if:false={hasActivity}>
    <div class="badge">
      <div class="badge__title">
        <lightning-icon
          icon-name="custom:custom18"
          size="x-small"
        ></lightning-icon>
        <span>Huddle strategy history</span>
      </div>
      <div class="empty slds-p-top_xx-small">
        No strategy session has been logged on this deal yet.
      </div>
    </div>
  </template>
</template>
