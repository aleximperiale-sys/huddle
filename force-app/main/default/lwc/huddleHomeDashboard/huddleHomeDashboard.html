<template>
  <template if:true={error}>
    <div class="slds-text-color_error slds-p-around_small" role="alert">
      {error}
    </div>
  </template>

  <!-- KPI row. Two meters (a value against its limit) and two counts. -->
  <div class="slds-grid slds-gutters_x-small slds-wrap slds-p-bottom_small">
    <div
      class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-bottom_x-small"
    >
      <lightning-card>
        <div class="tile">
          <svg
            class="ring"
            width="64"
            height="64"
            viewBox="0 0 64 64"
            role="img"
            aria-label={actionRing.alt}
          >
            <circle
              class="ring__track"
              cx="32"
              cy="32"
              r={actionRing.r}
              fill="none"
              stroke-width="6"
            ></circle>
            <circle
              class="ring__fill"
              cx="32"
              cy="32"
              r={actionRing.r}
              fill="none"
              stroke-width="6"
              stroke-linecap="round"
              stroke-dasharray={actionRing.dash}
              transform="rotate(-90 32 32)"
            ></circle>
            <text
              class="ring__value"
              x="32"
              y="32"
              text-anchor="middle"
              dominant-baseline="central"
            >
              {actionRing.label}
            </text>
          </svg>
          <div>
            <div class="tile__figure">{actionRing.value}</div>
            <div class="tile__label">action items completed</div>
            <div class="tile__sub">of {actionRing.total} created</div>
          </div>
        </div>
      </lightning-card>
    </div>

    <div
      class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-bottom_x-small"
    >
      <lightning-card>
        <div class="tile">
          <svg
            class="ring"
            width="64"
            height="64"
            viewBox="0 0 64 64"
            role="img"
            aria-label={decisionRing.alt}
          >
            <circle
              class="ring__track"
              cx="32"
              cy="32"
              r={decisionRing.r}
              fill="none"
              stroke-width="6"
            ></circle>
            <circle
              class="ring__fill"
              cx="32"
              cy="32"
              r={decisionRing.r}
              fill="none"
              stroke-width="6"
              stroke-linecap="round"
              stroke-dasharray={decisionRing.dash}
              transform="rotate(-90 32 32)"
            ></circle>
            <text
              class="ring__value"
              x="32"
              y="32"
              text-anchor="middle"
              dominant-baseline="central"
            >
              {decisionRing.label}
            </text>
          </svg>
          <div>
            <div class="tile__figure">{openDecisions}</div>
            <div class="tile__label">decisions still unresolved</div>
            <div class="tile__sub">{decisionRing.value} resolved so far</div>
          </div>
        </div>
      </lightning-card>
    </div>

    <div
      class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-bottom_x-small"
    >
      <lightning-card>
        <div class="tile">
          <lightning-icon
            icon-name="utility:groups"
            size="small"
            alternative-text="Strategy sessions"
          ></lightning-icon>
          <div>
            <div class="tile__figure">{sessionsThisWeek}</div>
            <div class="tile__label">strategy sessions this week</div>
            <div class="tile__sub">{sessionsAllTime} logged all time</div>
          </div>
        </div>
      </lightning-card>
    </div>

    <div
      class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-bottom_x-small"
    >
      <lightning-card>
        <div class="tile">
          <lightning-icon
            icon-name={unclearIcon}
            variant={unclearIconVariant}
            size="small"
            alternative-text={unclearWord}
          ></lightning-icon>
          <div>
            <div class="tile__figure">{ownerUnclear}</div>
            <div class="tile__label">action items with an unclear owner</div>
            <div class={unclearClass}>{unclearWord}</div>
          </div>
        </div>
      </lightning-card>
    </div>
  </div>

  <!-- Trend. One series, so the title names it and no legend box is needed. -->
  <div class="slds-p-bottom_small">
    <lightning-card
      title="Huddle activity, last 7 days"
      icon-name="standard:metrics"
    >
      <lightning-button
        slot="actions"
        variant="base"
        label={tableLabel}
        onclick={toggleTable}
      ></lightning-button>
      <template if:true={hasTrend}>
        <div class="plot-wrap slds-p-horizontal_medium slds-p-bottom_small">
          <svg
            class="trend"
            viewBox={trend.viewBox}
            role="img"
            aria-label="Daily count of Huddle actions over the last seven days"
          >
            <line
              class="trend__grid"
              x1={trend.left}
              y1={trend.baseline}
              x2={trend.right}
              y2={trend.baseline}
            ></line>
            <line
              class="trend__grid"
              x1={trend.left}
              y1={trend.top}
              x2={trend.right}
              y2={trend.top}
            ></line>
            <path class="trend__area" d={trend.area}></path>
            <path class="trend__line" d={trend.line}></path>

            <text class="trend__tick" x={trend.left} y={trend.tickY}>
              {trend.firstLabel}
            </text>
            <text
              class="trend__tick"
              x={trend.right}
              y={trend.tickY}
              text-anchor="end"
            >
              {trend.lastLabel}
            </text>
            <text class="trend__tick" x={trend.left} y={trend.top} dy="-4">
              {trend.maxLabel}
            </text>

            <circle
              class="trend__dot"
              cx={trend.end.x}
              cy={trend.end.y}
              r="5"
            ></circle>
            <text
              class="trend__endlabel"
              x={trend.end.x}
              y={trend.end.y}
              dx="10"
              dominant-baseline="central"
            >
              {trend.end.count}
            </text>

            <template for:each={trend.points} for:item="p">
              <rect
                key={p.key}
                class="trend__hit"
                data-key={p.key}
                x={p.hitX}
                y="0"
                width={p.hitW}
                height="170"
                onmouseenter={handleTrendEnter}
                onmouseleave={handleTrendLeave}
              ></rect>
            </template>
          </svg>

          <template if:true={hoveredTooltip}>
            <div class="tooltip" style={hoveredTooltip.style}>
              {hoveredTooltip.text}
            </div>
          </template>
        </div>
      </template>
      <template if:false={hasTrend}>
        <p class="slds-p-around_medium slds-text-color_weak">
          No activity recorded yet.
        </p>
      </template>
    </lightning-card>
  </div>

  <div class="slds-grid slds-gutters_x-small slds-wrap">
    <div
      class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-bottom_small"
    >
      <lightning-card
        title="What Huddle did this week"
        icon-name="standard:record"
      >
        <template if:true={hasByType}>
          <div class="bars">
            <template for:each={byType} for:item="row">
              <div key={row.key} class="bar-row">
                <span class="bar-row__label">{row.label}</span>
                <div class="bar-row__track">
                  <div class="bar-row__fill" style={row.style}></div>
                </div>
                <span class="bar-row__value">{row.count}</span>
              </div>
            </template>
          </div>
        </template>
        <template if:false={hasByType}>
          <p class="slds-p-around_medium slds-text-color_weak">
            Nothing logged this week yet.
          </p>
        </template>
      </lightning-card>
    </div>

    <div
      class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-bottom_small"
    >
      <lightning-card title="Most active this week" icon-name="standard:user">
        <template if:true={hasContributors}>
          <div class="bars">
            <template for:each={topContributors} for:item="row">
              <div key={row.key} class="bar-row">
                <span class="bar-row__label">{row.label}</span>
                <div class="bar-row__track">
                  <div class="bar-row__fill" style={row.style}></div>
                </div>
                <span class="bar-row__value">{row.count}</span>
              </div>
            </template>
          </div>
        </template>
        <template if:false={hasContributors}>
          <p class="slds-p-around_medium slds-text-color_weak">
            No strategy sessions logged this week yet.
          </p>
        </template>
      </lightning-card>
    </div>
  </div>

  <lightning-card
    title="Open decisions aging past a week"
    icon-name="standard:question_feed"
  >
    <template if:true={hasAging}>
      <div class="slds-p-horizontal_medium slds-p-bottom_small">
        <template for:each={agingDecisions} for:item="d">
          <div key={d.id} class="aging-item">
            <lightning-icon
              icon-name={d.icon}
              variant={d.iconVariant}
              size="x-small"
              alternative-text="Aging"
            ></lightning-icon>
            <div>
              <a
                href="#"
                data-id={d.id}
                onclick={openRecord}
                class="aging-item__question"
                >{d.question}</a
              >
              <div class="aging-item__meta">{d.opportunityName}</div>
            </div>
            <span class={d.severityClass}>{d.ageLabel}</span>
          </div>
        </template>
      </div>
    </template>
    <template if:false={hasAging}>
      <p class="slds-p-around_medium slds-text-color_weak">
        Nothing has been left hanging longer than a week.
      </p>
    </template>
  </lightning-card>

  <!-- The table view: every plotted value reachable without relying on color. -->
  <template if:true={showTable}>
    <div class="slds-p-top_small">
      <lightning-card title="Table view" icon-name="utility:table">
        <table class="table-view">
          <thead>
            <tr>
              <th scope="col">Group</th>
              <th scope="col">Label</th>
              <th scope="col">Count</th>
            </tr>
          </thead>
          <tbody>
            <template for:each={tableRows} for:item="row">
              <tr key={row.key}>
                <td>{row.group}</td>
                <td>{row.label}</td>
                <td>{row.count}</td>
              </tr>
            </template>
          </tbody>
        </table>
      </lightning-card>
    </div>
  </template>
</template>
