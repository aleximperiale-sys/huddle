<template>
  <div class="slds-grid slds-gutters slds-wrap slds-p-bottom_small">
    <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4">
      <lightning-card>
        <div class="slds-p-around_medium slds-text-align_center">
          <div class="slds-text-heading_large">{sessionsThisWeek}</div>
          <div class="slds-text-body_small slds-text-color_weak">
            strategy sessions this week
          </div>
        </div>
      </lightning-card>
    </div>
    <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4">
      <lightning-card>
        <div class="slds-p-around_medium slds-text-align_center">
          <div class="slds-text-heading_large">{actionItemProgress}</div>
          <div class="slds-text-body_small slds-text-color_weak">
            action items completed / created
          </div>
        </div>
      </lightning-card>
    </div>
    <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4">
      <lightning-card>
        <div class="slds-p-around_medium slds-text-align_center">
          <div class="slds-text-heading_large">{openDecisions}</div>
          <div class="slds-text-body_small slds-text-color_weak">
            decisions still unresolved
          </div>
        </div>
      </lightning-card>
    </div>
    <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4">
      <lightning-card>
        <div class="slds-p-around_medium slds-text-align_center">
          <div class={unclearClass}>{actionItemsOwnerUnclear}</div>
          <div class="slds-text-body_small slds-text-color_weak">
            action items with an unclear owner
          </div>
        </div>
      </lightning-card>
    </div>
  </div>

  <template if:true={error}>
    <div class="slds-text-color_error slds-p-around_small" role="alert">
      {error}
    </div>
  </template>

  <div class="slds-grid slds-gutters slds-wrap">
    <div
      class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-bottom_small"
    >
      <lightning-card
        title="Open decisions aging past a week"
        icon-name="standard:question_feed"
      >
        <template if:true={hasAging}>
          <ul class="slds-has-dividers_bottom-space slds-p-horizontal_medium">
            <template for:each={agingDecisions} for:item="d">
              <li key={d.id} class="slds-item">
                <a
                  data-id={d.id}
                  onclick={openRecord}
                  class="slds-text-body_regular"
                  >{d.question}</a
                >
                <div class="slds-text-body_small slds-text-color_weak">
                  {d.opportunityName} &middot; open {d.daysOpen} days
                </div>
              </li>
            </template>
          </ul>
        </template>
        <template if:false={hasAging}>
          <p class="slds-p-around_medium slds-text-color_weak">
            Nothing has been left hanging longer than a week.
          </p>
        </template>
      </lightning-card>
    </div>

    <div
      class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-bottom_small"
    >
      <lightning-card title="Most active this week" icon-name="standard:user">
        <template if:true={hasContributors}>
          <ul class="slds-has-dividers_bottom-space slds-p-horizontal_medium">
            <template for:each={topContributors} for:item="c">
              <li
                key={c.label}
                class="slds-item slds-grid slds-grid_align-spread"
              >
                <span>{c.label}</span>
                <span class="slds-badge">{c.count}</span>
              </li>
            </template>
          </ul>
        </template>
        <template if:false={hasContributors}>
          <p class="slds-p-around_medium slds-text-color_weak">
            No strategy sessions logged this week yet.
          </p>
        </template>
      </lightning-card>
    </div>
  </div>

  <lightning-card
    title="Huddle activity, last 7 days"
    icon-name="standard:metrics"
  >
    <div class="slds-p-horizontal_medium slds-p-bottom_medium">
      <template for:each={trend} for:item="t">
        <div
          key={t.key}
          class="slds-grid slds-grid_vertical-align-center slds-p-vertical_xxx-small"
        >
          <div
            class="slds-size_1-of-4 slds-text-body_small slds-text-color_weak"
          >
            {t.label}
          </div>
          <div
            class="slds-size_3-of-4 slds-grid slds-grid_vertical-align-center"
          >
            <div class="huddle-bar" style={t.style}></div>
            <span class="slds-p-left_x-small slds-text-body_small"
              >{t.count}</span
            >
          </div>
        </div>
      </template>
    </div>
  </lightning-card>
</template>
